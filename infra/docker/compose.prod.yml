# Production Docker Compose for FocusFlow
# Usage:
#   cd infra/docker
#   cp .env.prod.example .env.prod
#   # Fill .env.prod with real values
#   docker compose -f compose.prod.yml --env-file .env.prod up -d
#
# Migrations (run separately, NOT on every startup):
#   docker compose -f compose.prod.yml --env-file .env.prod run --rm api \
#     alembic -c alembic.ini upgrade head

services:
  # ── Reverse proxy (only service exposed to the internet) ───────────
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_started
      grafana:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Backend API ────────────────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - .env.prod
    environment:
      DB_POOL_SIZE: ${DB_POOL_SIZE}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW}

      PG_SSLROOTCERT: /tmp/prod-ca-2021.crt
      DB_SSL_ALLOW_SELF_SIGNED: "0"
      DB_SSL_DISABLE: "0"

      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}

      LOG_LEVEL: ${LOG_LEVEL}
      ENV: ${ENV}
      SERVICE_NAME: api
      REQUEST_TIMEOUT_S: ${REQUEST_TIMEOUT_S}
      UVICORN_ACCESS_LOG: "false"
      DB_LOG_QUERIES: ${DB_LOG_QUERIES}

      CORS_ORIGINS: ${CORS_ORIGINS}

      REDIS_COORDINATION_HOST: redis-coordination
      REDIS_COORDINATION_PORT: 6379
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: 6379

      CURSOR_SECRET: ${CURSOR_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      BASE_URL: ${AGENT_BASE_URL}
      AGENT_MODEL: ${AGENT_MODEL}
      AGENT_TOOL_TIMEOUT_S: ${AGENT_TOOL_TIMEOUT_S:-60}
    depends_on:
      redis-coordination:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    volumes:
      - ../certs/prod-ca-2021.crt:/tmp/prod-ca-2021.crt:ro
      - ../../services/api/alembic.ini:/app/alembic.ini:ro
    # No --reload, no alembic, no source mounts
    command: uvicorn backend.apps.api.main:app --host 0.0.0.0 --port 8001 --workers 2 --no-access-log
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ── Admin panel (SPA served via nginx) ────────────────────────────
  admin:
    build:
      context: ../../apps/admin
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    # No ports exposed — Caddy proxies admin.{DOMAIN}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  # ── Redis: coordination (noeviction — rate limits, semaphores) ─────
  redis-coordination:
    image: redis:7-alpine
    container_name: focusflow-redis-coordination
    volumes:
      - redis-coordination-data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --save 60 100
    # No ports exposed — internal only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300M

  # ── Redis: cache (allkeys-lru — ETag, cursor, gamification) ────────
  redis-cache:
    image: redis:7-alpine
    container_name: focusflow-redis-cache
    command: >
      redis-server
      --appendonly no
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    # No ports exposed — internal only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 600M

  # ── Monitoring: Loki (log aggregation) ─────────────────────────────
  loki:
    image: grafana/loki:latest
    # No ports exposed — internal only
    volumes:
      - loki-data:/loki
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Monitoring: Promtail (log shipper → Loki) ─────────────────────
  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/tmp
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Monitoring: Prometheus (metrics) ───────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    # No ports exposed — internal only
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    depends_on:
      - node_exporter
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Monitoring: Node Exporter (host metrics) ──────────────────────
  node_exporter:
    image: prom/node-exporter:latest
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    # No ports exposed — internal only
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  # ── Monitoring: Grafana (dashboards & alerting) ────────────────────
  grafana:
    image: grafana/grafana:latest
    # No ports exposed — Caddy proxies grafana.sparcarclabs.com
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
      - GF_SERVER_DOMAIN=grafana.${DOMAIN}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  caddy_data:
  caddy_config:
  redis-coordination-data:
  loki-data:
  promtail-data:
  grafana-data:
  prometheus-data:
