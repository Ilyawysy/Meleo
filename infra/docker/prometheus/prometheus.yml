global:
  scrape_interval: 60s
  evaluation_interval: 60s
  external_labels:
    cluster: 'yhorm'
    environment: 'dev'


scrape_configs:
  # Node Exporter - системные метрики хоста
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node_exporter:9100']
        labels:
          instance: 'server'
          job: 'node-exporter'

  # Meleo API - application metrics (prometheus_client)
  - job_name: 'meleo-api'
    static_configs:
      - targets: ['api:8001']
        labels:
          instance: 'api'
    metrics_path: '/metrics'