[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meleo-backend"
version = "0.1.0"
description = "Meleo backend service"
readme = { text = "Meleo backend service.", content-type = "text/markdown" }
authors = [{ name = "Meleo", email = "dev@meleo.local" }]
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.115.0",
	"uvicorn[standard]>=0.30.0",
	"pydantic[email]>=2.5",
	"pydantic-settings>=2.0",
	"sqlalchemy[asyncio]>=2.0",
	"asyncpg>=0.29.0",
	"alembic>=1.13.0",
	"structlog>=24.1.0",
	"httpx>=0.27.0",
	"pyjwt[crypto]>=2.8.0",
	"bcrypt>=4.0.0",
	"langchain-openai>=0.1.0",
	"langchain-core>=0.1.0",
	"langchain-community>=0.0.20",
	"langchain>=0.1.0",
	"python-dotenv>=1.0.0",
	"supabase",
	"redis>=5.0.0",
	"prometheus-client>=0.20.0",
	"celery[redis]>=5.3.0",
]

[project.optional-dependencies]
dev = [
	"pytest>=7.4",
	"pytest-asyncio>=0.23",
	"pytest-cov>=4.1",
	"mypy>=1.7",
	"ruff>=0.6",
]

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
